openapi: 3.0.3
info:
  title: Authy Platform API
  version: 1.0.0
  description: Tenant-isolated identity, application access, and audit API.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Get authenticated identity, roles, and permissions
      responses:
        '200':
          {
            description: Identity response,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataResponse' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
  /setup/status:
    get:
      security: []
      summary: Check whether first-install setup is required
      responses: { '200': { description: Setup status } }
  /setup:
    post:
      security: []
      summary: Create the first organization owner on an empty installation
      responses:
        {
          '201': { description: Installation initialized },
          '409': { $ref: '#/components/responses/Error' },
        }
  /auth/methods:
    get:
      security: []
      summary: Resolve password or organization SSO for an email address
      parameters:
        [{ name: email, in: query, required: true, schema: { type: string, format: email } }]
      responses: { '200': { description: Available sign-in method } }
  /auth/oidc-prompt:
    delete:
      security: []
      summary: Clear a pending OIDC login prompt before mandatory password rotation
      responses: { '204': { description: Prompt cleared } }
  /applications:
    get:
      summary: List assigned or marketplace applications
      parameters:
        - { name: marketplace, in: query, schema: { type: boolean } }
      responses: { '200': { description: Application list } }
    post:
      summary: Register an application (admin)
      responses:
        {
          '201': { description: Application created },
          '403': { $ref: '#/components/responses/Error' },
        }
  /applications/{id}/assignments:
    post:
      summary: Assign an application to a user or group (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Assignment created } }
  /applications/{id}/launch:
    get:
      summary: Validate access and launch an assigned application
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '302': { description: Redirect to application },
          '403': { $ref: '#/components/responses/Error' },
        }
  /applications/{id}:
    patch:
      summary: Publish or unpublish an application (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Application updated } }
    delete:
      summary: Delete an application and its assignments (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Application deleted } }
  /access-requests:
    get: { summary: List access requests, responses: { '200': { description: Request list } } }
    post:
      { summary: Create an access request, responses: { '201': { description: Request created } } }
  /access-requests/{id}:
    patch:
      summary: Approve or deny an access request (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Request decided } }
  /api-keys:
    get:
      {
        summary: List service credentials (admin),
        responses: { '200': { description: Key metadata } },
      }
    post:
      {
        summary: Generate a service credential (admin),
        responses: { '201': { description: Secret returned once } },
      }
  /audit-events:
    get:
      summary: Retrieve tenant audit events (admin)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: Paginated events } }
  /admin/settings:
    get:
      {
        summary: Read organization branding (admin),
        responses: { '200': { description: Settings } },
      }
    patch:
      {
        summary: Update organization branding (admin),
        responses: { '200': { description: Updated } },
      }
  /admin/users:
    get:
      {
        summary: List users,
        roles,
        groups,
        and app access (admin),
        responses: { '200': { description: User directory } },
      }
    post:
      {
        summary: Generate a credential user or enroll an existing account (admin),
        responses: { '201': { description: User created and credentials emailed when new } },
      }
  /admin/users/{id}:
    patch:
      summary: Update user standing, roles, groups, and apps (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
    delete:
      summary: Remove a user from the organization (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Removed } }
  /admin/users/{id}/credentials:
    post:
      summary: Generate and email a replacement temporary password (admin)
      description: Available only for non-self password identities belonging solely to the current organization. Revokes active sessions and requires password replacement at next sign-in.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: Replacement credentials accepted for delivery },
          '400': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
        }
  /admin/groups:
    get:
      {
        summary: List groups and inherited app permissions (admin),
        responses: { '200': { description: Groups } },
      }
    post: { summary: Create an RBAC group (admin), responses: { '201': { description: Created } } }
  /admin/groups/{id}:
    patch:
      summary: Update group members and app permissions (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete an RBAC group (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted } }
  /admin/auth-providers:
    get:
      summary: List safe SSO provider metadata (admin)
      responses: { '200': { description: Provider configurations without secrets } }
    post:
      summary: Configure Google, Microsoft, Slack, or Entra-backed Active Directory (admin)
      responses: { '201': { description: Provider configured } }
  /admin/auth-providers/{id}:
    delete:
      summary: Delete an organization SSO provider (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Provider deleted } }
  /admin/email-settings:
    get:
      summary: Read safe Resend metadata and transactional email templates (admin)
      responses: { '200': { description: Provider metadata without the API key and all templates } }
    patch:
      summary: Save encrypted Resend credentials, sender identity, and delivery state (admin)
      responses:
        {
          '200': { description: Safe provider metadata },
          '400': { $ref: '#/components/responses/Error' },
        }
  /admin/email-settings/templates/{type}:
    patch:
      summary: Sanitize and save a transactional email template (admin)
      parameters:
        - {
            name: type,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/EmailTemplateType' },
          }
      responses:
        { '200': { description: Saved template }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Restore a transactional email template to its system default (admin)
      parameters:
        - {
            name: type,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/EmailTemplateType' },
          }
      responses: { '200': { description: Default template } }
  /admin/email-settings/test-send:
    post:
      summary: Send a template preview through the saved Resend connection (admin)
      responses:
        {
          '200': { description: Test accepted by Resend },
          '400': { $ref: '#/components/responses/Error' },
        }
  /vault:
    get:
      summary: List accessible Vault item metadata
      responses: { '200': { description: Tenant-scoped metadata without encrypted values } }
    post:
      summary: Create and assign an encrypted Vault item (admin)
      responses: { '201': { description: Vault item created } }
  /vault/{id}:
    patch:
      summary: Update an encrypted Vault item and assignments (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Vault item updated } }
    delete:
      summary: Delete a Vault item (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Vault item deleted } }
  /vault/{id}/reveal:
    post:
      summary: Reveal an assigned Vault value and record an audit event
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Decrypted value; never cache } }
  /account/password-changed:
    post:
      summary: Complete mandatory first-login password rotation
      responses: { '200': { description: Password lifecycle state updated } }
  /account/onboarding-complete:
    post:
      summary: Mark the guided product tour complete or skipped
      responses: { '200': { description: Onboarding state updated } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: authy.session_token }
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    DataResponse: { type: object, required: [data], properties: { data: { type: object } } }
    EmailTemplateType:
      type: string
      enum: [USER_CREDENTIALS, PASSWORD_RESET, INVITATION]
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message],
                properties: { code: { type: string }, message: { type: string }, details: {} },
              },
          },
      }
  responses:
    Error:
      {
        description: Error response,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
