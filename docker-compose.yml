services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ['5432:5432']
    volumes: [authy-postgres:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
    restart: unless-stopped
  app:
    build:
      context: .
      network: host
    env_file: .env
    ports: ['3000:3000']
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            'CMD',
            'node',
            '-e',
            "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
          ],
        interval: 15s,
        timeout: 5s,
        retries: 10,
      }
    restart: unless-stopped
volumes:
  authy-postgres:
